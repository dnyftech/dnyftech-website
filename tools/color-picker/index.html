<main class="wrap">
<p class="eyebrow">Local browser utility</p><h1>Color Picker</h1><p>Choose a color and copy its HEX, RGB, or HSL representation.</p>
<label for="picker">Select color</label><input id="picker" type="color" value="#3ddc84">
<div class="card" id="preview" style="margin:20px 0;min-height:100px"><strong>Preview</strong></div>
<label for="hex">HEX</label><input id="hex" readonly>
<label for="rgb">RGB</label><input id="rgb" readonly>
<label for="hsl">HSL</label><input id="hsl" readonly><p id="status" class="status"></p>
<script>
const picker=document.querySelector('#picker');
function update(){const hex=picker.value,r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
document.querySelector('#hex').value=hex;document.querySelector('#rgb').value=`rgb(${r}, ${g}, ${b})`;
const rr=r/255,gg=g/255,bb=b/255,max=Math.max(rr,gg,bb),min=Math.min(rr,gg,bb),d=max-min;
let h=0,s=0,l=(max+min)/2;if(d){s=d/(1-Math.abs(2*l-1));switch(max){case rr:h=((gg-bb)/d+(gg<bb?6:0))/6;break;case gg:h=((bb-rr)/d+2)/6;break;default:h=((rr-gg)/d+4)/6}}
document.querySelector('#hsl').value=`hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
document.querySelector('#preview').style.background=hex;document.querySelector('#status').textContent='Color values updated.'}
picker.addEventListener('input',update);update();
</script></main>
<footer><div class="wrap">DNYFTECH · Engineering, AI research and development · <a href="https://github.com/dnyftech/dnyftech-website">Source repository</a></div></footer>
